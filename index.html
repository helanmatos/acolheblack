<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ACOLHE — Você não está sozinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F8F5F1; color: #0A0A0A; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  button:hover { transform: translateY(-1px); }
  .btn-primary:hover, .btn-whats:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0,0,0,0.22) !important; }
  .svc-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.12) !important; }
  .dual-card:hover { transform: translateY(-4px); box-shadow: 0 28px 64px rgba(10,10,10,0.24) !important; }
  a:hover { opacity: 1; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(10,10,10,0.18); border-radius: 999px; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(124,255,161,0.7); }
    50% { box-shadow: 0 0 0 8px rgba(124,255,161,0); }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 8px 24px rgba(37,211,102,0.45); }
    50% { box-shadow: 0 12px 32px rgba(37,211,102,0.65); }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (max-width: 980px) {
    .nav-links { display: none !important; }
    .nav-mobile { display: inline-flex !important; }
    .hero-grid { grid-template-columns: 1fr !important; padding: 0 24px !important; }
    .hero-avatar { display: none; }
    .dual-grid { grid-template-columns: 1fr !important; }
    .svc-grid { grid-template-columns: 1fr !important; }
    .timeline-row { grid-template-columns: 1fr 1fr !important; row-gap: 40px; }
    .timeline-line { display: none; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; }
    section { padding-left: 24px !important; padding-right: 24px !important; padding-top: 60px !important; padding-bottom: 60px !important; }
    nav { padding-left: 24px !important; padding-right: 24px !important; }
    nav img { height: 64px !important; }
    [data-screen-label="01 Hero"] { padding-top: 120px !important; padding-bottom: 48px !important; }
    [data-screen-label="Stats"] { padding-top: 48px !important; padding-bottom: 48px !important; }
    .dual-card { padding: 28px !important; }
    .dual-card h3 { font-size: 26px !important; }
  }
  @media (max-width: 600px) {
    .timeline-row { grid-template-columns: 1fr !important; }
    .footer-grid { grid-template-columns: 1fr !important; gap: 36px !important; }
    .footer-grid > div:first-child { grid-column: 1 !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>
</body>
</html>
